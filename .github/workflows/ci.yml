name: quality-gate
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - run: ruff check supply_chain python tests
      - run: pytest --cov=supply_chain --cov-report=term-missing
      - run: python -m supply_chain.pipeline --scale dev --seed 42
      - run: python powerbi/Templates/render_mockups.py
