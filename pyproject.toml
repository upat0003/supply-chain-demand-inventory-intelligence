[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "supply-chain-demand-inventory-intelligence"
version = "1.0.0"
description = "Demand forecasting and inventory intelligence platform for a regional retail supply chain"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2", "numpy>=1.26", "scikit-learn>=1.4", "statsmodels>=0.14",
    "duckdb>=1.1", "pyyaml>=6", "joblib>=1.3",
]

[tool.setuptools.packages.find]
include = ["supply_chain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings"

[tool.ruff]
line-length = 110
target-version = "py311"
